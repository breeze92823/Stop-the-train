name: Deploy to Bloxity

# Builds the frontend and uploads it to Bloxity Hosting (https://hosting.bloxity.io/docs).
# main -> prod channel (https://<gameId>.play.bloxity.io), dev -> dev channel (https://<gameId>.dev.play.bloxity.io).
# Pull requests only build. Needs LEGION_GAME_ID (variable or secret) and LEGION_DEPLOY_TOKEN (secret).
# Optional: LEGION_DEPLOY_TOKEN_STAGE also deploys to the Boxity stage platform (stage.bloxity.io) as a
# separate job; it never falls back to the prod token. Run by hand with `target` = staging | prod.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      target:
        description: Platform to deploy to
        type: choice
        options: [staging, prod]
        default: staging

concurrency:
  group: deploy-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Determine deploy channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "channel=prod" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        # VITE_DEV_MODE is deliberately unset so deployed builds use the real Bloxity SDK/CDN.
        # No server URL: built games reach Stop-the-train-backend through the Bloxity matchmaker
        # (Legion.SDK.net.resolveEndpoint in src/bloxity.js). The slug is the game id from My Games.
        env:
          VITE_GAME_SLUG: ${{ vars.LEGION_GAME_ID || secrets.LEGION_GAME_ID }}
        run: |
          if [ "${{ steps.channel.outputs.channel }}" = "prod" ]; then
            npm run build
          else
            npm run build:dev
          fi

      - name: Zip build
        run: cd dist && zip -r ../build.zip . && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build.zip
          retention-days: 7

    outputs:
      channel: ${{ steps.channel.outputs.channel }}

  targets:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - id: pick
        env:
          HAS_STAGE: ${{ secrets.LEGION_DEPLOY_TOKEN_STAGE != '' }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${INPUT_TARGET}" = "prod" ]; then echo 'list=["prod"]' >> "$GITHUB_OUTPUT"; else echo 'list=["staging"]' >> "$GITHUB_OUTPUT"; fi
          elif [ "${HAS_STAGE}" = "true" ]; then
            echo 'list=["prod","staging"]' >> "$GITHUB_OUTPUT"
          else
            echo 'list=["prod"]' >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [build, targets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build

      - name: Upload to Bloxity (${{ matrix.target }})
        env:
          GAME_ID: ${{ vars.LEGION_GAME_ID || secrets.LEGION_GAME_ID }}
          TOKEN_PROD: ${{ secrets.LEGION_DEPLOY_TOKEN }}
          TOKEN_STAGE: ${{ secrets.LEGION_DEPLOY_TOKEN_STAGE }}
          TARGET: ${{ matrix.target }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "${GAME_ID}" ]; then
            echo "::error::LEGION_GAME_ID is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ "${TARGET}" = "staging" ]; then
            API=https://api.stage.bloxity.io
            TOKEN="${TOKEN_STAGE}"
            [ -n "${TOKEN}" ] || { echo "::error::LEGION_DEPLOY_TOKEN_STAGE is empty; staging never uses the prod token."; exit 1; }
          else
            API=https://api.bloxity.io
            TOKEN="${TOKEN_PROD}"
            [ -n "${TOKEN}" ] || { echo "::error::LEGION_DEPLOY_TOKEN is not set (Settings > Secrets and variables > Actions > Secrets)."; exit 1; }
          fi
          curl -sS -f -X POST \
            "${API}/v1/hosting/games/${GAME_ID}/frontend?channel=${CHANNEL}&version=${SHA}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @build.zip \
            -w "\nHTTP status: %{http_code}\n"
